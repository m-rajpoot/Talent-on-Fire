<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- browser-tab icon: put your logo at public/logo.png (see README "Adding your logo") -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talent on Fire (TF) - search, apply and get your dream job. Free resume samples and career services." />
    <meta name="theme-color" content="#6A38C2" />
    <title>Talent on Fire</title>
    <script>
      // apply saved theme before React loads (prevents a white flash). Key must match src/context/themeContext.js
      (function () {
        try {
          var t = localStorage.getItem('talent-on-fire-theme');
          if (t !== 'light') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
